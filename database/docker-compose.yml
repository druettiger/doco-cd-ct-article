# Datenbank-Stack – absichtlich veraltete Versionen
# Redis aktuell: 8.x, PostgreSQL aktuell: 17.x
services:
  redis:
    image: redis:7.4.8
    ports:
      - "127.0.0.1:63799:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
  redis2:
    image: redis:7.4.8
    volumes:
      - redis-data-2:/data
    restart: unless-stopped

volumes:
  redis-data:
  redis-data-2:
